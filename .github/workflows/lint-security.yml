name: Linting & Security

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/lint-security.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: Go Static Analysis (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: --timeout=5m

  vulnerability-scan:
    name: Go Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gitleaks:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          "$(go env GOPATH)/bin/gitleaks" detect --source . --redact

  pr-metadata:
    name: PR Governance & Convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Issue Reference
        env:
          # Passed as environment variables, never interpolated into the script.
          # A pull request body is untrusted input: expanding ${{ }} inline puts
          # its backticks and $(...) through command substitution before bash
          # sees the assignment, which executes them on the runner.
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Escape every '#': one starting a word is a comment, and the line
          # then ends at '=~' with no right-hand side.
          if [[ ! "$BODY" =~ Closes\ \#[0-9]+ ]] && [[ ! "$BODY" =~ Fixes\ \#[0-9]+ ]] && [[ ! "$BODY" =~ Refs\ \#[0-9]+ ]] && [[ ! "$TITLE" =~ \#[0-9]+ ]]; then
            echo "::warning::Pull request body does not reference an issue (e.g., 'Closes #15'). Please ensure work is linked to an issue per AGENTS.md §3."
          fi
