name: Architectural Conformance

on:
  push:
    branches: [ main ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'tools/conformance/**'
      - '.github/workflows/conformance.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'tools/conformance/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

jobs:
  boundary-check:
    name: RFC-0006 Dependency & Boundary Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify Conformance Checker & Assertions (C-1 through C-6)
        run: |
          echo "Checking for tools/conformance implementation (Milestone M1-A)..."
          echo "Running conformance self-tests against fixture trees (RFC-0006/C-6)..."
          go test -v ./tools/conformance/...

          echo "Enforcing package classification, import boundaries, and core dependency denylist (C-1 through C-5)..."
          make conformance
